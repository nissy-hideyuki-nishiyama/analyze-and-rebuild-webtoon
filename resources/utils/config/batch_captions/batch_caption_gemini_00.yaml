  CRITICAL RESPOND RULES:
  - Output ONLY the final generated caption following the exact structure below.
  - Do NOT include any introductory or concluding text (e.g., "Sure, here is...", "Output:").
  - Do NOT wrap the text in markdown code blocks (such as ```).
  - Do NOT output any thinking process (<think> tags) in the final response.

  STRICT FORMATTING AND GENERATION RULES:

  [PART 1: DANBOORU TAGS SECTION]
  Generate a single comma-separated line of Danbooru tags following these precise constraints:
  a. Start exactly with the fixed core tags: "masterpiece, best quality, highly detailed, year 2025, explicit, "
  b. Immediately follow with the dynamic count of characters by gender based on the image (e.g., "3girls, 1boy, ").
  c. Then, list Danbooru tags for: character clothing state (e.g., clothed, shirtless), poses, visible body parts, face direction, eye contact/gaze, and overall actions or movements.
  d. CRITICAL EXCLUSIONS for Part 1: Do NOT include any Danbooru tags for the following elements. They must be completely excluded from this section:
     - Character physical features (e.g., hair color, hairstyle, eye color, breast size).
     - Character facial expressions.
     - Specific clothing items, their types, and their colors.

  [SECTION SEPARATOR]
  - You MUST insert exactly one completely blank line here to separate Part 1 and Part 2.

  [PART 2: NATURAL ENGLISH PROSE SECTION (SPATIAL POSITION CONTROL)]
  Describe the image details using fluent, natural English sentences. You must be extremely specific about screen positions to prevent character mixing:
  a. Individual Character Descriptions (One line per character, ordered from LEFT to RIGHT): 
     For each character detected, write exactly ONE dedicated line. You MUST start the line by clearly defining their absolute screen position (e.g., "On the far left,", "In the middle-left,", "In the center,", "On the right side,"). 
     Then, explicitly anchor all of that specific character's traits to that position: physical features (hair color/style, eye color, breast size), facial expression, precise clothing items (types, styles, colors), and their specific pose/action on that spot.
  b. Group Separator: 
     After listing all individual characters (repeating step 'a' for the exact count), you MUST insert exactly one completely blank line.
  c. Relationship, Interaction & Spatial Arrangement: 
     Describe the relative distance, physical contact, relationships, interactions, and collective actions between the characters (e.g., "The girl on the left is holding hands with the boy in the center while the girl on the right looks at them").
  d. Setting & Environment: 
     Write a description detailing the location, background elements, scenery, and any props or small objects present.
  e. Composition & Viewpoint: 
     Write a description detailing the framing/composition, camera angle, viewer's perspective, and the overall mood/atmosphere.
  f. Lighting & Shadows: 
     Write a description detailing the light source position, direction of light, and the resulting shadows on both the background and the characters.

